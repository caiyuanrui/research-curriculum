site_name: AI Tour
site_description: 每日一篇论文，追踪 AI 各领域发展脉络
site_url: https://caiyuanrui.github.io/research-curriculum
repo_url: https://github.com/caiyuanrui/research-curriculum
edit_uri: blob/main/docs/

theme:
  name: material
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
    admonition:
      note: material/note-edit-outline
      abstract: material/text-search
      info: material/information-outline
      tip: material/lightbulb-on-outline
      success: material/check-circle-outline
      question: material/help-circle-outline
      warning: material/alert-outline
      failure: material/close-circle-outline
      danger: material/lightning-bolt-outline
      bug: material/bug-outline
      example: material/test-tube
      quote: material/format-quote-open
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide
    - announce.dismiss
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 亮色模式
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 暗色模式

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Agent Course:
    - agents/index.md
    - Agent Architectures:
      - agents/agent-architectures/index.md
      - "ReAct (Yao 2023)": agents/agent-architectures/2022-10-06-react-yao-2022.md
  - Agentic RL:
    - agentic-rl/index.md
    - Policy Gradient Foundations:
      - agentic-rl/policy-gradient/index.md
      - "Policy Gradient Theorem (Sutton 2000)": agentic-rl/policy-gradient/1999-12-03-policy-gradient-theorem.md
      - "TRPO (Schulman 2015)": agentic-rl/policy-gradient/2015-02-19-trust-region-policy-optimization.md
  - Multimodal Course:
    - multimodal/index.md
    - VLM Pretraining:
      - multimodal/vlm-pretraining/index.md
      - "CLIP (Radford 2021)": multimodal/vlm-pretraining/2021-02-26-clip-radford-2021.md
      - "ALIGN (Jia 2021)": multimodal/vlm-pretraining/2021-02-11-align-jia-2021.md
  - Generative Models:
    - generative-models/index.md
    - Score-Based Models:
      - generative-models/score-based-models/index.md
      - "Score Matching (Hyvarinen 2005)": generative-models/score-based-models/2026-06-03-score-matching-hyvarinen-2005.md
      - "DAE to SM Connection (Vincent 2011)": generative-models/score-based-models/2026-06-03-dae-to-sm-connection-vincent-2011.md
  - LLM Systems:
    - llm-systems/index.md
    - Distributed Training:
      - llm-systems/distributed-training/index.md
      - "Megatron-LM (Shoeybi 2019)": llm-systems/distributed-training/2019-09-17-megatron-lm-shoeybi-2019.md
  - Lab Reports:
    - lab-reports/index.md
    - Weekly Lab Note:
      - lab-reports/weekly-lab-note/index.md
      - "GPT-5.5 Technical Report": lab-reports/weekly-lab-note/2026-04-23-gpt-5-5-technical-report.md
  - Cross-Domain Review:
    - cross-domain-summary/index.md
    - Weekly Synthesis:
      - cross-domain-summary/weekly-synthesis/index.md
      - "Week 23": cross-domain-summary/weekly-synthesis/2026-06-06-weekly-synthesis.md
  - Timeline: timeline.md
  - Knowledge Graph: knowledge-graph.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/caiyuanrui/research-curriculum
    - icon: fontawesome/solid/book-open
      link: https://caiyuanrui.github.io/research-curriculum
  generator: false
  analytics:
    provider: null


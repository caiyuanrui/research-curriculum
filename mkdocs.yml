site_name: Research Curriculum
site_description: 系统性的研究学习笔记 — 每日一篇论文，追踪 AI 各领域发展脉络
site_url: https://caiyuanrui.github.io/research-curriculum
repo_url: https://github.com/caiyuanrui/research-curriculum
edit_uri: blob/main/docs/

theme:
  name: material
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
    admonition:
      note: material/note-edit-outline
      abstract: material/text-search
      info: material/information-outline
      tip: material/lightbulb-on-outline
      success: material/check-circle-outline
      question: material/help-circle-outline
      warning: material/alert-outline
      failure: material/close-circle-outline
      danger: material/lightning-bolt-outline
      bug: material/bug-outline
      example: material/test-tube
      quote: material/format-quote-open
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide
    - announce.dismiss
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 亮色模式
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 暗色模式

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Agent Course:
    - agent/index.md
  - Multimodal Course:
    - multimodal/index.md
  - Diffusion Course:
    - diffusion/index.md
    - "001: Score Matching (Hyvarinen 2005)": diffusion/001-score-matching-hyvarinen-2005.md
    - "002: DAE to SM Connection (Vincent 2011)": diffusion/002-vincent-2011.md
  - LLM Systems:
    - systems/index.md
    - "001: Megatron-LM (Shoeybi 2019)": systems/001-megatron-lm-shoeybi-2019.md
  - Lab Reports:
    - labs/index.md
    - "001: GPT-5.5 Technical Report": labs/001-gpt-5-5-technical-report.md
  - Weekly Review:
    - weekly-review/index.md
    - "Cross-Domain Week 23": weekly-review/cross-domain-week-23.md
    - "Weekly Review Week 23": weekly-review/weekly-week-23.md
  - Timeline: timeline.md
  - Knowledge Graph: knowledge-graph.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/caiyuanrui/research-curriculum
    - icon: fontawesome/solid/book-open
      link: https://caiyuanrui.github.io/research-curriculum
  generator: false
  analytics:
    provider: null

copyright: CC BY-NC 4.0 · Built with MkDocs Material
